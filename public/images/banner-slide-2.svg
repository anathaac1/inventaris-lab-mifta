<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%" fill="none" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <!-- Dark Midnight Ambient Background -->
    <linearGradient id="bgDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081220"/>
      <stop offset="50%" stop-color="#0B1728"/>
      <stop offset="100%" stop-color="#0F213A"/>
    </linearGradient>

    <linearGradient id="metalRack2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="neonShadow2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>

    <filter id="darkShadow2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Midnight Ambient Room - Fills 100% -->
  <rect width="600" height="260" fill="url(#bgDark2)"/>

  <!-- Glowing Cyan Ambient Orbs -->
  <circle cx="450" cy="110" r="130" fill="#0284C7" fill-opacity="0.14" filter="url(#neonShadow2)"/>
  <circle cx="340" cy="170" r="90" fill="#38BDF8" fill-opacity="0.08"/>

  <!-- Left Fade Gradient to blend with slide text smoothly -->
  <rect width="180" height="260" fill="url(#bgDark2)" fill-opacity="0.95"/>

  <!-- INFOGRAPHIC POSTER ON WALL (SOP Peminjaman) -->
  <g filter="url(#darkShadow2)">
    <rect x="180" y="24" width="105" height="135" rx="6" fill="#0D1B2A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="190" y="44" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">SOP PEMINJAMAN</text>
    <text x="190" y="53" font-family="system-ui, sans-serif" font-size="5.5" font-weight="600" fill="#38BDF8">Cepat • Tepat • Otomatis</text>
    <line x1="190" y1="59" x2="275" y2="59" stroke="#1E293B" stroke-width="1"/>

    <!-- Step 1: Ajukan -->
    <rect x="190" y="65" width="15" height="15" rx="3" fill="#0369A1" stroke="#38BDF8" stroke-width="0.8"/>
    <path d="M 195 72 L 200 72 M 197.5 69.5 L 197.5 74.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <text x="210" y="73" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#FFFFFF">1. Ajukan</text>
    <text x="210" y="79" font-family="system-ui, sans-serif" font-size="5" font-weight="500" fill="#94A3B8">Pilih alat di portal</text>

    <!-- Step 2: Scan -->
    <rect x="190" y="88" width="15" height="15" rx="3" fill="#0284C7" stroke="#38BDF8" stroke-width="0.8"/>
    <rect x="194" y="92" width="7" height="7" rx="1" fill="#FFFFFF"/>
    <text x="210" y="96" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#38BDF8">2. Scan QR</text>
    <text x="210" y="102" font-family="system-ui, sans-serif" font-size="5" font-weight="500" fill="#94A3B8">Verifikasi barcode</text>

    <!-- Step 3: Ambil Barang -->
    <rect x="190" y="111" width="15" height="15" rx="3" fill="#10B981" stroke="#34D399" stroke-width="0.8"/>
    <path d="M 194 118 L 197 121 L 202 115" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <text x="210" y="119" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#FFFFFF">3. Ambil</text>
    <text x="210" y="125" font-family="system-ui, sans-serif" font-size="5" font-weight="500" fill="#94A3B8">Selesai seketika</text>

    <rect x="190" y="136" width="85" height="14" rx="2.5" fill="#09131F" stroke="#1E293B" stroke-width="0.6"/>
    <text x="195" y="145" font-family="system-ui, sans-serif" font-size="5" font-weight="600" fill="#38BDF8">Satu Sistem Praktis</text>
  </g>

  <!-- INDUSTRIAL BLACK STORAGE SHELVES WITH LABELED BINS - EXTENDS TO X=600 -->
  <g filter="url(#darkShadow2)">
    <!-- Vertical Posts -->
    <rect x="305" y="15" width="6" height="200" rx="1.5" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <rect x="400" y="15" width="6" height="200" rx="1.5" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <rect x="500" y="15" width="6" height="200" rx="1.5" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <rect x="594" y="15" width="6" height="200" rx="1.5" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>

    <!-- Shelf 1 (Top) -->
    <rect x="300" y="48" width="300" height="5" rx="1.5" fill="url(#metalRack2)" stroke="#334155" stroke-width="0.8"/>
    <!-- Bin: KAMERA -->
    <rect x="318" y="20" width="72" height="28" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="326" y="30" width="56" height="9" rx="1.5" fill="#1E293B" stroke="#0284C7" stroke-width="0.6"/>
    <text x="336" y="37" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#38BDF8" letter-spacing="0.8">KAMERA</text>

    <!-- Bin: PROYEKTOR -->
    <rect x="412" y="20" width="78" height="28" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="420" y="30" width="62" height="9" rx="1.5" fill="#1E293B" stroke="#0284C7" stroke-width="0.6"/>
    <text x="428" y="37" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#38BDF8" letter-spacing="0.8">PROYEKTOR</text>

    <!-- Bin: EXTRA -->
    <rect x="512" y="20" width="78" height="28" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="520" y="30" width="62" height="9" rx="1.5" fill="#1E293B" stroke="#0284C7" stroke-width="0.6"/>
    <text x="532" y="37" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#38BDF8" letter-spacing="0.8">ACC LAB</text>

    <!-- Shelf 2 (Middle) -->
    <rect x="300" y="105" width="300" height="5" rx="1.5" fill="url(#metalRack2)" stroke="#334155" stroke-width="0.8"/>
    <!-- Bin: LAPTOP -->
    <rect x="318" y="77" width="72" height="28" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="326" y="87" width="56" height="9" rx="1.5" fill="#1E293B" stroke="#38BDF8" stroke-width="0.6"/>
    <text x="339" y="94" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#38BDF8" letter-spacing="0.8">LAPTOP</text>

    <!-- Bin: TABLET -->
    <rect x="412" y="77" width="78" height="28" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="420" y="87" width="62" height="9" rx="1.5" fill="#1E293B" stroke="#38BDF8" stroke-width="0.6"/>
    <text x="436" y="94" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#38BDF8" letter-spacing="0.8">TABLET</text>

    <!-- Bin: ROUTER -->
    <rect x="512" y="77" width="78" height="28" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="520" y="87" width="62" height="9" rx="1.5" fill="#1E293B" stroke="#38BDF8" stroke-width="0.6"/>
    <text x="536" y="94" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#38BDF8" letter-spacing="0.8">ROUTER</text>

    <!-- Shelf 3 (Lower) -->
    <rect x="300" y="160" width="300" height="5" rx="1.5" fill="url(#metalRack2)" stroke="#334155" stroke-width="0.8"/>
    <rect x="318" y="132" width="180" height="28" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <rect x="385" y="128" width="45" height="5" rx="1.5" fill="#475569"/>
    <text x="355" y="150" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold" fill="#94A3B8">TOOLSET &amp; PERANGKAT NETWORK</text>
  </g>

  <!-- FOREGROUND DESK SURFACE - EXTENDS FULL WIDTH -->
  <path d="M 0 205 L 600 205 L 600 260 L 0 260 Z" fill="#0B131E"/>
  <line x1="0" y1="205" x2="600" y2="205" stroke="#1E293B" stroke-width="2"/>
  <rect x="0" y="205" width="600" height="4" fill="#111C2B"/>

  <!-- DESK SCANNER & LAPTOP SETUP -->
  <g filter="url(#darkShadow2)">
    <!-- BARCODE SCANNER GUN (Left Desk) -->
    <g transform="translate(260, 160)">
      <path d="M 8 48 L 26 48 L 32 55 L 4 55 Z" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <path d="M 15 30 L 20 48 L 13 49 L 9 30 Z" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <path d="M 7 22 L 28 18 L 34 31 L 11 33 Z" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
      <rect x="30" y="20" width="4" height="10" rx="1" fill="#38BDF8" filter="url(#neonShadow2)"/>
      <line x1="34" y1="25" x2="65" y2="35" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
    </g>

    <!-- ACRYLIC QR STAND (Center Desk) -->
    <g filter="url(#neonShadow2)" transform="translate(320, 155)">
      <path d="M 0 12 L 36 4 L 42 58 L 4 60 Z" fill="#0F172A" fill-opacity="0.95" stroke="#38BDF8" stroke-width="1.2"/>
      <rect x="0" y="58" width="44" height="5" rx="1.5" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="8" y="17" font-family="system-ui, sans-serif" font-size="4" font-weight="800" fill="#38BDF8" transform="rotate(-3 8 17)">SCAN QR</text>
      <text x="8" y="23" font-family="system-ui, sans-serif" font-size="4" font-weight="800" fill="#FFFFFF" transform="rotate(-3 8 23)">PINJAM ALAT</text>

      <g transform="translate(9, 26) rotate(-3)">
        <rect width="20" height="20" fill="#0B131E" rx="1.5" stroke="#1E293B" stroke-width="0.8"/>
        <rect x="1.5" y="1.5" width="5.5" height="5.5" fill="#38BDF8"/>
        <rect x="2.5" y="2.5" width="3.5" height="3.5" fill="#0B131E"/>
        <rect x="13" y="1.5" width="5.5" height="5.5" fill="#38BDF8"/>
        <rect x="14" y="2.5" width="3.5" height="3.5" fill="#0B131E"/>
        <rect x="1.5" y="13" width="5.5" height="5.5" fill="#38BDF8"/>
        <rect x="2.5" y="14" width="3.5" height="3.5" fill="#0B131E"/>
        <rect x="8.5" y="2.5" width="2.5" height="2.5" fill="#FFFFFF"/>
        <rect x="8.5" y="7" width="3" height="2.5" fill="#38BDF8"/>
        <rect x="13" y="8.5" width="3" height="3" fill="#38BDF8"/>
      </g>
    </g>

    <!-- MODERN LAPTOP PORTAL (Right Desk) -->
    <g transform="translate(385, 135)">
      <path d="M 0 72 L 125 72 L 138 84 L -11 84 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <path d="M 4 0 L 120 0 L 125 72 L 0 72 Z" fill="#080E18" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="9" y="6" width="107" height="60" rx="2" fill="#0A1424" stroke="#0284C7" stroke-width="0.8"/>

      <rect x="12" y="9" width="101" height="9" rx="1.5" fill="#0F1C30"/>
      <circle cx="17" cy="13.5" r="2" fill="#38BDF8"/>
      <text x="22" y="16" font-family="system-ui, sans-serif" font-size="4" font-weight="bold" fill="#38BDF8">VERIFIKASI SCAN PINJAMYUK</text>

      <rect x="12" y="21" width="48" height="36" rx="2" fill="#060C14" stroke="#38BDF8" stroke-width="0.8"/>
      <path d="M 23 29 L 23 34 M 51 29 L 51 34 M 23 49 L 23 44 M 51 49 L 51 44" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="18" y="40" font-family="system-ui, sans-serif" font-size="3.5" font-weight="bold" fill="#38BDF8">SCANNING</text>

      <rect x="65" y="21" width="48" height="36" rx="2" fill="#0F1C30"/>
      <rect x="69" y="26" width="40" height="4.5" rx="1" fill="#38BDF8"/>
      <rect x="69" y="34" width="32" height="3" rx="1" fill="#64748B"/>
      <rect x="69" y="40" width="36" height="3" rx="1" fill="#64748B"/>
      <rect x="69" y="46" width="40" height="7" rx="1.5" fill="#10B981"/>
      <text x="74" y="51.5" font-family="system-ui, sans-serif" font-size="3.5" font-weight="bold" fill="#FFFFFF">TERVERIFIKASI</text>
    </g>
  </g>
</svg>
